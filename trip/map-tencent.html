<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<meta name="description" content="黔川 + 新疆 30 天自驾路线图：腾讯矢量底图 + 6 段分色路线 + 49 个景点标注，手机可交互缩放">
<title>路线图 · 黔川 + 新疆 30 天自驾 · 真实底图版</title>
<style>
:root{
  --bg:#eef0f3; --card:#fff; --line:#e2e4e9; --line2:#cfd3da;
  --t1:#16181d; --t2:#5a5f6a; --t3:#8b909a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--t1);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

#top{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px;
  padding-top:calc(8px + env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--line);z-index:12}
#top a{font-size:13px;color:#1a5fb4;text-decoration:none;font-weight:600;flex:0 0 auto}
#top .t{flex:1 1 auto;font-size:13.5px;font-weight:600;text-align:center;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#top button{flex:0 0 auto;font:inherit;font-size:12.5px;font-weight:600;color:var(--t2);
  background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:5px 10px;cursor:pointer}
#top button.on{background:var(--t1);color:#fff;border-color:var(--t1)}

#stage{position:relative;flex:1 1 auto;min-height:0;background:#e8ebef;overflow:hidden}
#gmap{position:absolute;inset:0;width:100%;height:100%}

#hud{position:absolute;left:10px;top:10px;z-index:6;pointer-events:none;
  display:flex;flex-direction:column;gap:7px;max-width:calc(100% - 66px)}
#hud .box{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:10px;
  padding:7px 10px;box-shadow:0 2px 8px rgba(0,0,0,.07);pointer-events:auto}
#hud .ttl{font-size:12.5px;font-weight:600;line-height:1.35}
#hud .sub{font-size:11px;color:var(--t2);margin-top:1px}
#legend{display:flex;flex-direction:column;gap:3px}
#legend div{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t1)}
#legend i{width:12px;height:3px;border-radius:2px;display:block;flex:0 0 12px}

#zoombar{position:absolute;right:10px;bottom:14px;z-index:6;display:flex;flex-direction:column;gap:7px}
#zoombar button{width:38px;height:38px;border:1px solid var(--line2);border-radius:10px;
  background:rgba(255,255,255,.96);color:var(--t1);font-size:17px;line-height:1;
  box-shadow:0 2px 8px rgba(0,0,0,.07);cursor:pointer;padding:0}
#zoombar button.sm{font-size:11px;font-weight:600}
#zoombar button:active{background:#eef2f8}

#scalebar{position:absolute;right:56px;bottom:14px;z-index:6;background:rgba(255,255,255,.9);
  border:1px solid var(--line);border-radius:6px;padding:2px 6px 3px;box-shadow:0 1px 5px rgba(0,0,0,.06);
  font-size:10px;color:var(--t2);text-align:center;line-height:1.2}
#scalebar .bar{height:5px;border-left:1.5px solid var(--t2);border-right:1.5px solid var(--t2);
  border-bottom:1.5px solid var(--t2);margin:2px auto 1px}

#layers{position:absolute;right:10px;bottom:62px;z-index:14;display:none;background:rgba(255,255,255,.98);
  border:1px solid var(--line2);border-radius:11px;padding:9px 11px;box-shadow:0 6px 22px rgba(0,0,0,.16);
  min-width:168px}
#layers.on{display:block}
#layers .lt{font-size:11px;color:var(--t3);margin-bottom:6px;letter-spacing:.04em}
#layers label{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;cursor:pointer}
#layers input{width:15px;height:15px;accent-color:#1a5fb4;margin:0}
#layers .sep{height:1px;background:var(--line);margin:7px 0}
#layers .btn{width:100%;font:inherit;font-size:12.5px;font-weight:600;padding:7px 8px;border-radius:8px;
  border:1px solid var(--line2);background:#f7f8fa;color:var(--t1);cursor:pointer}
#layers .btn:active{background:#eef2f8}
#layers .note{font-size:10.5px;color:var(--t3);margin-top:6px;line-height:1.5}

#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:20;
  background:rgba(22,24,29,.88);color:#fff;font-size:12px;padding:7px 14px;border-radius:999px;
  display:none;max-width:86%;text-align:center}
#toast.on{display:block}

#credit{position:absolute;left:10px;bottom:4px;z-index:5;font-size:9.5px;color:#6b7280;
  background:rgba(255,255,255,.72);padding:1px 6px;border-radius:4px;pointer-events:none}

#sheet{flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;box-shadow:0 -3px 16px rgba(0,0,0,.09);
  display:flex;flex-direction:column;max-height:50vh;margin-top:-14px;z-index:9}
#grab{padding:9px 0 3px;display:flex;justify-content:center;cursor:pointer}
#grab i{width:36px;height:4px;border-radius:2px;background:var(--line2);display:block}
#chips{display:flex;gap:6px;padding:3px 12px 9px;overflow-x:auto;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
#chips button{flex:0 0 auto;font:inherit;font-size:12px;padding:5px 10px;border-radius:999px;
  border:1px solid var(--line2);background:var(--card);color:var(--t2);cursor:pointer;white-space:nowrap}
#chips button.on{color:#fff;border-color:transparent}
#plist{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 14px;
  border-top:1px solid var(--line)}
#sheet.collapsed #plist{display:none}
#plist .grp{padding:10px 14px 4px;font-size:11.5px;color:var(--t3);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
#plist .grp i{width:8px;height:8px;border-radius:50%;display:block;flex:0 0 8px}
#plist .it{display:flex;align-items:flex-start;gap:10px;padding:9px 14px;cursor:pointer;
  border-bottom:1px solid #f2f3f5}
#plist .it:active,#plist .it.act{background:#eff3fa}
#plist .bd{flex:0 0 auto;width:24px;height:24px;border-radius:50%;color:#fff;font-size:11.5px;
  font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:1px}
#plist .bd.city{background:#fff;color:var(--t2);border:1.5px solid var(--line2)}
#plist .nm{font-size:13.5px;font-weight:500;line-height:1.4}
#plist .dt{font-size:11.5px;color:var(--t3);margin-top:1px}
#plist .lg{font-size:11px;color:#8a8f99;margin-top:2px}
#plist .tx{font-size:11.5px;color:var(--t2);margin-top:3px;line-height:1.55}
#sheet .hint{font-size:10.5px;color:var(--t3);text-align:center;padding:0 12px 7px;line-height:1.5}

#notice{padding:34px 22px;max-width:560px;margin:0 auto;color:var(--t1)}
#notice h1{font-size:17px;margin:0 0 10px}
#notice p{font-size:13px;color:var(--t2);line-height:1.75;margin:0 0 12px}
#notice ol{font-size:13px;color:var(--t2);line-height:1.9;padding-left:20px;margin:0 0 14px}
#notice code{background:#f2f3f5;border-radius:4px;padding:1px 5px;font-size:12px}
#notice .go{display:inline-block;margin-top:6px;font-size:13px;font-weight:600;color:#fff;
  background:#1a5fb4;border-radius:8px;padding:9px 16px;text-decoration:none}
#notice .krow{display:flex;gap:8px;margin:4px 0 10px;flex-wrap:wrap}
#notice .krow input{flex:1 1 240px;min-width:0;font-size:13px;padding:10px 12px;
  border:1.5px solid var(--line2);border-radius:8px;background:#fff;color:var(--t1);outline:none}
#notice .krow input:focus{border-color:#1a5fb4;box-shadow:0 0 0 3px rgba(26,95,180,.12)}
#notice .krow button{font-size:13px;font-weight:600;color:#fff;background:#1a5fb4;border:0;
  border-radius:8px;padding:10px 18px;cursor:pointer}
#notice .krow button[disabled]{opacity:.62;cursor:default}
#notice .khint{font-size:12px;color:var(--t3);line-height:1.7;background:#f6f7f9;
  border-radius:8px;padding:10px 12px}
#notice .ksub{font-size:12.5px;color:var(--t3);margin:-4px 0 12px}
#notice .kmini{font-size:12.5px;color:var(--t3)}
#notice .kmini a{color:#1a5fb4}

/* 底图没渲染出来时的浮动提示（不遮挡地图） */
#tip{position:absolute;left:12px;right:12px;bottom:12px;z-index:40;max-width:400px;
  margin:0 auto;font-size:12px;line-height:1.7;color:#6b5a20;background:#fffdf3;
  border:1px solid #e8d9a4;border-radius:10px;padding:10px 12px;
  box-shadow:0 8px 22px rgba(0,0,0,.14)}
#tip b{color:#8a6d10}
#tip a{color:#1a5fb4;font-weight:600}

@media(min-width:760px){
  #app{display:grid;grid-template-columns:342px 1fr;grid-template-rows:auto 1fr;
       grid-template-areas:"top top" "sheet stage"}
  #top{grid-area:top}
  #stage{grid-area:stage}
  #sheet{grid-area:sheet;max-height:none;margin-top:0;border-radius:0;border-top:0;
         border-right:1px solid var(--line);box-shadow:none}
  #grab{display:none}
  #chips{padding-top:10px}
}
</style>
</head>

<script>
/* ============================================================
   底图模式判定（按优先级三条路）
   ① 本页有 key  → 地址栏 ?key=xxx  / 浏览器里存过的 key  / 下面 TMAP_KEY 内置
   ② 本机预览    → 自动走免密钥代理（WorkBuddy 预览服务注入），无需 key
   ③ 公网且无 key → 显示「填 key」页，粘贴后立即生效并记住
   ⚠️ 内置 key 对任何访客都是明文可读的，请务必在腾讯位置服务控制台
      给该 key 配好 Referer（域名）白名单，例如 chiukitleung.github.io
   ============================================================ */
var TMAP_KEY = '';                      /* ← 想硬编码 key 就填这里（记得配域名白名单） */
var KEY_STORE = 'xj_trip_tmap_key';

try { if (/[?&]nokey=1/.test(location.search)) localStorage.removeItem(KEY_STORE); } catch (e) {}

function readKey(){
  var m = location.search.match(/[?&]key=([^&]*)/);
  var k = '';
  if (m && m[1]) {
    try { k = decodeURIComponent(m[1]); } catch (e) { k = m[1]; }
    try { localStorage.setItem(KEY_STORE, k); } catch (e) {}
  } else {
    try { k = localStorage.getItem(KEY_STORE) || ''; } catch (e) { k = ''; }
  }
  return (k || TMAP_KEY || '').replace(/^\s+|\s+$/g, '');
}

var MODE = (function(){
  var key = readKey();
  if (key) return { mode: 'key', key: key };

  var host = location.hostname;
  /* 免密钥代理只存在于 WorkBuddy 预览服务里：它会把下面两个占位符换成真实端口与密钥。
     普通本机服务器（python -m http.server 等）不会替换，所以要判断一下再用。 */
  var isLocal = (host === 'localhost' || host === '127.0.0.1' || host === '::1') &&
                /^https?:$/.test(location.protocol);
  if (isLocal) {
    var sh = 'http://127.0.0.1:__WB_HTTP_PORT__/_TMapService/_wbt/__WB_TMAP_SECRET__';
    if (sh.indexOf('__WB_') === -1) {
      window._TMapSecurityConfig = { serviceHost: sh };
      return { mode: 'proxy' };
    }
  }
  return { mode: 'none' };
})();

if (MODE.mode === 'none') {
  document.getElementById('stage').innerHTML =
    '<div id="notice">' +
      '<h1>填入腾讯地图 key，真实底图立刻出现</h1>' +
      '<p>整张路线图（6 段分色路线 · 49 个景点 · 28 段里程时长）都已经画好了，'
      + '只差一把「合规底图的钥匙」——浏览器限制底图必须由合规地图服务商提供，且 key 不能由页面自带。</p>' +
      '<div class="krow">' +
        '<input id="kin" type="text" spellcheck="false" autocomplete="off" ' +
        'placeholder="粘贴腾讯地图 key，形如 XXXX-XXXX-XXXX-XXXX-XXXX-XXXX">' +
        '<button id="kgo" type="button">用这个 key</button>' +
      '</div>' +
      '<p class="ksub">key 只保存在你这台设备的浏览器里，不会上传到任何服务器；也可以直接在网址后加 <code>?key=你的key</code>。</p>' +
      '<p class="khint">还没申请？约 3 分钟：打开 <b>lbs.qq.com</b> → 控制台（个人实名即可）→ 应用管理 → 创建应用 → '
      + '添加 Key，勾选 <b>JavaScript API GL</b> 与 <b>WebServiceAPI</b>；'
      + '再到该 key 的「域名白名单」里填 <code>chiukitleung.github.io</code>。</p>' +
      '<p>不想申请 key，可以先看自绘示意版：<br>' +
      '<a class="go" href="map-svg.html">打开示意版路线图 →</a></p>' +
    '</div>';

  (function(){
    var kin = document.getElementById('kin'), kgo = document.getElementById('kgo');
    function submit(){
      var v = (kin.value || '').replace(/^\s+|\s+$/g, '');
      if (!v) { kin.focus(); return; }
      try { localStorage.setItem(KEY_STORE, v); } catch (e) {}
      kgo.disabled = true;
      kgo.textContent = '正在加载底图…';
      /* 同时写进地址栏：某些隐私模式下 localStorage 不可用，URL 里的 key 兜底 */
      location.replace(location.pathname + '?key=' + encodeURIComponent(v));
    }
    kgo.addEventListener('click', submit);
    kin.addEventListener('keydown', function(e){ if (e.key === 'Enter') submit(); });
    kin.focus();
  })();
}

var SEG = [
  {n:'黔川纵游',    full:'① 黔川纵游',    d:'9/30 – 10/5',   c:'#3f6ea8'},
  {n:'西行入疆',    full:'② 西行入疆',    d:'10/6 – 10/11',  c:'#0f7b7d'},

   t:'遇龙河竹筏是阳朔真正的精华（比漓江大船好得多）。国庆筏工紧张，提前 1–2 天线上订筏，早上第一班人最少。'},

  {n:'荔波小七孔', lng:107.6719, lat:25.2616, g:0, c:0, lv:1, hub:1, alt:420, tk:'120 + 观光车 40–50', d:'D3 · 10/2 全天', leg:{km:430,h:5.5,rd:'G78 汕昆'},

   t:'走北门（比西门少 2 km 山路，索道也排队少）。19:30 全寨灯光点亮，建议住半山腰民宿，从阳台看夜景。'},

   t:'住安顺比住景区便宜且吃饭方便。龙宫景区就在附近，多一天的话可以加。'},

        if (acc[p.no]){
          if (newGeo[g].length === 0 && i > 1) newGeo[g].push([S[i - 1].lng, S[i - 1].lat]);
          acc[p.no].forEach(function(q){ newGeo[g].push(q); });
        }
      });
      for (var g = 0; g < newGeo.length; g++) if (newGeo[g].length > 1) GEO[g] = newGeo[g];
      polyGeo = GEO.map(function(pts, g){
        return { id: 'seg' + g, styleId: 's' + g, paths: pts.map(function(p){ return new TMap.LatLng(p[1], p[0]); }) };
      });
      polyGeo.push({ id: 'alt', styleId: 'alt', visible: layer.alt, paths: ALT.map(function(p){ return new TMap.LatLng(p[1], p[0]); }) });
      useRealRoad = true;
      refresh();
      toast('已完成真实路网重算' + (fail ? '（' + fail + ' 段失败，保留示意线）' : ''), 3000);
    }
  });

  /* ---------- 启动 ---------- */
  buildChips(); syncChips();
  buildList();
  fitAll();
  refresh();
  window.addEventListener('resize', function(){ lvShown = -1; refresh(); });
  setTimeout(function(){ lvShown = -1; refresh(); }, 280);
  window.__mapReady = true;

};

/* ---------- SDK 加载 ---------- */
(function(){
  if (MODE.mode === 'none') return;

  function tip(html){
    var old = document.getElementById('tip');
    if (old) old.parentNode.removeChild(old);
    var d = document.createElement('div');
    d.id = 'tip';
    d.innerHTML = html;
    document.getElementById('stage').appendChild(d);
  }

  var s = document.createElement('script');
  s.src = 'https://map.qq.com/api/gljs?v=1.exp&libraries=service'
        + (MODE.mode === 'key' ? '&key=' + encodeURIComponent(MODE.key) : '');
  s.onerror = function(){
    document.getElementById('stage').innerHTML =
      '<div id="notice"><h1>底图加载失败</h1>' +
      '<p>腾讯地图 SDK 没能加载。多半是网络被挡，或这枚 key 没开通「JavaScript API GL」。</p>' +
      '<p class="kmini"><a href="?nokey=1">重新填写 key →</a>　·　' +
      '<a href="map-svg.html">先用自绘示意版 →</a></p></div>';
  };
  s.onload = function(){
    try {
      if (typeof window.__initMap === 'function') window.__initMap();
    } catch (e) {
      tip('<b>地图初始化出错</b>：' + e.message +
          '<br><a href="?nokey=1">换一枚 key</a>　或　<a href="map-svg.html">看示意版</a>');
      return;
    }
    /* 看门狗：8 秒后仍没把地图跑起来，多半是 key 鉴权没过（页面会是一片灰） */
    setTimeout(function(){
      if (window.__mapReady) return;
      var msg = MODE.mode === 'key'
        ? '底图没出来：这枚 key 可能没开通 <b>JavaScript API GL</b>，或「域名白名单」没包含当前站点。'
        : '底图没出来：免密钥预览通道可能被占用，请重新打开预览。';
      tip(msg + '<br><a href="?nokey=1">换一枚 key</a>　或　<a href="map-svg.html">看示意版</a>');
    }, 8000);
  };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
