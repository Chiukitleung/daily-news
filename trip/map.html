<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<meta name="description" content="黔川 + 新疆 30 天自驾路线图：地形、山脉、水系、公路编号、49 个景点标注，手机可交互缩放">
<title>路线图 · 黔川 + 新疆 30 天自驾 · 详细景点标注</title>
<style>
:root{
  --bg:#eef0f3; --card:#fff; --line:#e2e4e9; --line2:#cfd3da;
  --t1:#16181d; --t2:#5a5f6a; --t3:#8b909a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--t1);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

#top{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px;
  padding-top:calc(8px + env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--line)}
#top a{font-size:13px;color:#1a5fb4;text-decoration:none;font-weight:600;flex:0 0 auto}
#top .t{flex:1 1 auto;font-size:13.5px;font-weight:600;text-align:center;letter-spacing:-.2px}
#top button{flex:0 0 auto;font:inherit;font-size:12.5px;font-weight:600;color:var(--t2);
  background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:5px 10px;cursor:pointer}
#top button.on{background:var(--t1);color:#fff;border-color:var(--t1)}

#stage{position:relative;flex:1 1 auto;min-height:0;background:#f7f8fa;overflow:hidden;touch-action:none}
#map{display:block;width:100%;height:100%;cursor:grab}
#map.grabbing{cursor:grabbing}
#map text{font-family:inherit}

#hud{position:absolute;left:10px;top:10px;z-index:6;pointer-events:none;
  display:flex;flex-direction:column;gap:7px;max-width:calc(100% - 66px)}
#hud .box{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:10px;
  padding:7px 10px;box-shadow:0 2px 8px rgba(0,0,0,.07);pointer-events:auto}
#hud .ttl{font-size:12.5px;font-weight:600;line-height:1.35}
#hud .sub{font-size:11px;color:var(--t2);margin-top:1px}
#legend{display:flex;flex-direction:column;gap:3px}
#legend div{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t1)}
#legend i{width:12px;height:3px;border-radius:2px;display:block;flex:0 0 12px}

#zoombar{position:absolute;right:10px;top:10px;z-index:6;display:flex;flex-direction:column;gap:7px}
#zoombar button{width:38px;height:38px;border:1px solid var(--line2);border-radius:10px;
  background:rgba(255,255,255,.96);color:var(--t1);font-size:17px;line-height:1;
  box-shadow:0 2px 8px rgba(0,0,0,.07);cursor:pointer;padding:0}
#zoombar button.sm{font-size:11px;font-weight:600}
#zoombar button:active{background:#eef2f8}

#scalebar{position:absolute;right:10px;z-index:6;background:rgba(255,255,255,.92);
  border:1px solid var(--line);border-radius:7px;padding:3px 7px 4px;box-shadow:0 1px 5px rgba(0,0,0,.06);
  font-size:10px;color:var(--t2);text-align:center;line-height:1.25}
#scalebar .bar{height:6px;border-left:1.5px solid var(--t2);border-right:1.5px solid var(--t2);
  border-bottom:1.5px solid var(--t2);margin:2px auto 1px}

#layers{position:absolute;right:10px;z-index:14;display:none;background:rgba(255,255,255,.98);
  border:1px solid var(--line2);border-radius:11px;padding:9px 11px;box-shadow:0 6px 22px rgba(0,0,0,.16);
  min-width:150px}
#layers.on{display:block}
#layers .lt{font-size:11px;color:var(--t3);margin-bottom:6px;letter-spacing:.04em}
#layers label{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;cursor:pointer}
#layers input{width:15px;height:15px;accent-color:#1a5fb4;margin:0}

#tip{position:absolute;left:10px;right:10px;bottom:10px;z-index:8;display:none;
  background:rgba(255,255,255,.98);border:1px solid var(--line2);border-radius:12px;
  padding:12px 13px;box-shadow:0 6px 24px rgba(0,0,0,.16);max-height:62%;overflow-y:auto}
#tip.on{display:block}
#tip .h{display:flex;align-items:flex-start;gap:8px;margin-bottom:4px}
#tip .badge{flex:0 0 auto;width:21px;height:21px;border-radius:50%;color:#fff;font-size:11px;
  font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:2px}
#tip .nm{font-size:15px;font-weight:600;flex:1 1 auto;line-height:1.35}
#tip .cls{flex:0 0 auto;font-size:19px;line-height:1;color:var(--t3);padding:0 2px;cursor:pointer;background:none;border:0}
#tip .dt{font-size:11.5px;color:var(--t3);margin:0 0 6px}
#tip .tx{font-size:12.5px;color:var(--t2);margin:0;line-height:1.62}
#tip .mt{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
#tip .mt span{font-size:11px;background:var(--bg);border-radius:6px;padding:3px 8px;color:var(--t2)}
#tip .mt span b{color:var(--t1);font-weight:600}

#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:20;
  background:rgba(22,24,29,.88);color:#fff;font-size:12px;padding:7px 14px;border-radius:999px;
  display:none;max-width:86%;text-align:center}
#toast.on{display:block}

#sheet{flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;box-shadow:0 -3px 16px rgba(0,0,0,.09);
  display:flex;flex-direction:column;max-height:52vh;margin-top:-14px;z-index:9}
#grab{padding:9px 0 3px;display:flex;justify-content:center;cursor:pointer}
#grab i{width:36px;height:4px;border-radius:2px;background:var(--line2);display:block}
#chips{display:flex;gap:6px;padding:3px 12px 9px;overflow-x:auto;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
#chips button{flex:0 0 auto;font:inherit;font-size:12px;padding:5px 10px;border-radius:999px;
  border:1px solid var(--line2);background:var(--card);color:var(--t2);cursor:pointer;white-space:nowrap}
#chips button.on{color:#fff;border-color:transparent}
#plist{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 14px;
  border-top:1px solid var(--line)}
#sheet.collapsed #plist{display:none}
#plist .grp{padding:10px 14px 4px;font-size:11.5px;color:var(--t3);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
#plist .grp i{width:8px;height:8px;border-radius:50%;display:block;flex:0 0 8px}
#plist .it{display:flex;align-items:flex-start;gap:10px;padding:9px 14px;cursor:pointer;
  border-bottom:1px solid #f2f3f5}
#plist .it:active,#plist .it.act{background:#eff3fa}
#plist .bd{flex:0 0 auto;width:24px;height:24px;border-radius:50%;color:#fff;font-size:11.5px;
  font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:1px}
#plist .bd.city{background:#fff;color:var(--t2);border:1.5px solid var(--line2)}
#plist .nm{font-size:13.5px;font-weight:500;line-height:1.4}
#plist .dt{font-size:11.5px;color:var(--t3);margin-top:1px}
#plist .lg{font-size:11px;color:#8a8f99;margin-top:2px}
#plist .tx{font-size:11.5px;color:var(--t2);margin-top:3px;line-height:1.55}
#sheet .hint{font-size:10.5px;color:var(--t3);text-align:center;padding:0 12px 7px;line-height:1.5}
@media(min-width:760px){ #sheet{max-height:46vh} }
</style>
</head>

/* ================= 布局 / 坐标 ================= */
function layout(){ cw = stage.clientWidth || 360; ch = stage.clientHeight || 500; s = Math.min(cw / 1000, ch / VH); }
function SX(X){ return tx + k * X; }
function SY(Y){ return ty + k * Y; }

function arcPoint(arr, a, b, t){
  var tot = 0, segs = [], i, dx, dy, d;
  for (i = a; i < b; i++){
    dx = arr[i + 1][0] - arr[i][0]; dy = arr[i + 1][1] - arr[i][1]; d = Math.hypot(dx, dy);
    segs.push(d); tot += d;
  }
  if (!tot) return arr[a];
  var want = tot * t, acc = 0;
  for (i = 0; i < segs.length; i++){
    if (acc + segs[i] >= want){
      var r = segs[i] ? (want - acc) / segs[i] : 0;
      return [arr[a + i][0] + (arr[a + i + 1][0] - arr[a + i][0]) * r,
              arr[a + i][1] + (arr[a + i + 1][1] - arr[a + i][1]) * r];
    }
    acc += segs[i];
  }
  return arr[b];
}
/* 估算文字屏幕宽度（中日韩全角按 1em、其余按 0.56em） */
function estW(txt, fs){
  var w = 0, i, c;
  for (i = 0; i < txt.length; i++){
    c = txt.charCodeAt(i);
    w += (c > 0x2E80) ? 1 : 0.56;
  }
  return w * fs;
}
function hits(list, r){
  for (var i = 0; i < list.length; i++){
    var a = list[i];
    if (r.x0 < a.x1 && r.x1 > a.x0 && r.y0 < a.y1 && r.y1 > a.y0) return true;
  }
  return false;
}

function render(){

  gWater.setAttribute('display', layer.terr ? '' : 'none');

    pl.setAttribute('opacity', pl.dataset.spur ? (on ? '0.55' : '0.06') : (on ? '0.95' : '0.10'));
  });

  var isAll = (filter === 'all');
  var showT = layer.terr && (!isAll || k >= 1.35);
  var showR = layer.mtn  && (!isAll || k >= 1.12);
  var showP = layer.mtn  && (!isAll || k >= 1.55);
  var showB = layer.road && (!isAll || k >= 2.4);

  var fgl = Math.max(8.5, 7.2 * px), ftl = Math.max(9.5, 8 * px), frl = Math.max(9.5, 8 * px),
      fwl = Math.max(9, 7.5 * px), fpn = Math.max(9, 7.6 * px), fph = Math.max(8, 6.8 * px),
      fbt = Math.max(9, 7.6 * px), fll = Math.max(9, 7.4 * px);

  for (i = 0; i < labs.g.length; i++){
    el = labs.g[i];
    el.setAttribute('x', f1(SX(Number(el.dataset.x))));
    el.setAttribute('y', f1(SY(Number(el.dataset.y))));
    el.setAttribute('font-size', fgl);
    el.setAttribute('text-anchor', el.dataset.a ? 'start' : 'middle');
    el.setAttribute('dominant-baseline', 'middle');
    el.setAttribute('fill', '#a8aeb8');
    el.setAttribute('stroke', 'rgba(255,255,255,.9)');
    el.setAttribute('stroke-width', String(fgl * 0.3));
  }
  /* 地理名称标签：彼此避让（不与里程标签互斥，里程信息优先） */
  var rects = [], geoRects = [], rt;
  var gStyle = {
    r:{fs:Math.max(9.5, 8 * px), fill:'#9b9382', ls:'0.08em', on:showR},
    t:{fs:Math.max(9.5, 8 * px), fill:'#b3a992', ls:'0.14em', on:showT},
    w:{fs:Math.max(9, 7.5 * px),  fill:'#7d9cbd', ls:'0',      on:showT}
  };
  for (i = 0; i < geo.length; i++){
    var G = geo[i], st = gStyle[G.k];
    if (!st.on){ G.el.setAttribute('display', 'none'); continue; }
    var gx = SX(G.x), gy = SY(G.y), gw = estW(G.el.textContent, st.fs);
    rt = {x0:gx - gw / 2, x1:gx + gw / 2, y0:gy - st.fs * 0.72, y1:gy + st.fs * 0.72};
    if (hits(geoRects, rt)){ G.el.setAttribute('display', 'none'); continue; }
    geoRects.push(rt);

    G.el.setAttribute('transform', 'translate(' + f1(gx) + ',' + f1(gy) + ')');
    G.el.setAttribute('text-anchor', 'middle');
    G.el.setAttribute('dominant-baseline', 'middle');

  for (i = 0; i < peaks.length; i++){

    el.querySelector('.ph').setAttribute('font-size', fph);
    el.querySelector('.pn').setAttribute('fill', '#6d6557');
    el.querySelector('.ph').setAttribute('fill', '#9a917f');
    el.setAttribute('pointer-events', 'none');
  }
  for (i = 0; i < badges.length; i++){
    el = badges[i];
    el.setAttribute('display', showB ? '' : 'none');
    el.setAttribute('transform', 'translate(' + f1(SX(Number(el.dataset.x))) + ',' + f1(SY(Number(el.dataset.y))) + ')');
    var bt = el.querySelector('.bt');
    bt.setAttribute('font-size', fbt);
    bt.setAttribute('text-anchor', 'middle');
    bt.setAttribute('dominant-baseline', 'central');
    bt.setAttribute('fill', '#5a5f6a');
    el.setAttribute('pointer-events', 'none');
  }
  /* 里程标签 */
  var showL = layer.leg && (!isAll || k >= 1.3);
  for (i = 0; i < legLbls.length; i++){
    el = legLbls[i];
    var L = LEGLBL[i], p = S[L.i];
    var on = showL && (isAll || Number(filter) === L.g);
    if (!on){ el.setAttribute('display', 'none'); continue; }
    var mid = arcPoint(FULL[L.g], L.a, L.b, 0.5);
    /* 沿路径法线上下交替偏移，减少相邻里程标签互撞 */
    var q1 = arcPoint(FULL[L.g], L.a, L.b, 0.40), q2 = arcPoint(FULL[L.g], L.a, L.b, 0.60);
    var ddx = SX(q2[0]) - SX(q1[0]), ddy = SY(q2[1]) - SY(q1[1]);
    var dl = Math.hypot(ddx, ddy) || 1;
    var off = (i % 2 ? 12 : -12);
    var x = SX(mid[0]) + (-ddy / dl) * off;
    var y = SY(mid[1]) + (ddx / dl) * off;
    var txt = p.leg.km + ' km · ' + p.leg.h + ' h';
    var lw = estW(txt, fll) * (isAll ? 1 : 0.62);

    el.setAttribute('stroke', 'rgba(255,255,255,.95)');
    el.setAttribute('stroke-width', String(fll * 0.34));
    el.setAttribute('paint-order', 'stroke');
    el.setAttribute('pointer-events', 'none');
    if (el.textContent !== txt) el.textContent = txt;
  }

  /* 点位 */
  var show2 = !isAll || k >= 1.9;
  var show3 = !isAll || k >= 3.4;
  var lab1 = !isAll || k >= 1.45;
  var lab2 = !isAll || k >= 2.6;
  var lab3 = !isAll || k >= 4.2;
  var R  = Math.max(11, 8 * px);
  var R2 = Math.max(18, 18 * px);
  var fs = Math.max(10, 8 * px);
  var lf = Math.max(10.5, 8 * px);

  /* 按屏幕距离自动避让：太近的点位只保留权重高的一个，放大后自然全部露出 */
  var dThr = 17 / (k * s);
  var declut = {}, placedP = [], cand = [];
  for (i = 0; i < S.length; i++){
    var P0 = S[i];
    if (!(isAll || P0.g === Number(filter))) continue;

  }
  cand.sort(function(a, b){ return (S[b].w || 0) - (S[a].w || 0) || a - b; });
  for (i = 0; i < cand.length; i++){
    var ci = cand[i], keep = true;
    for (j = 0; j < placedP.length; j++){
      if (Math.hypot(S[ci].X - placedP[j][0], S[ci].Y - placedP[j][1]) < dThr){ keep = false; break; }
    }
    declut[ci] = keep;
    if (keep) placedP.push([S[ci].X, S[ci].Y]);
  }
  for (i = 0; i < S.length; i++){
    var P = S[i], nd = nodes[i];
    var vis = (isAll || P.g === Number(filter)) &&
              (P.lv === 1 || (P.lv === 2 && show2) || (P.lv === 3 && show3));
    if (vis && i !== active && declut[i] === false) vis = false;
    if (!vis){ nd.g.setAttribute('display', 'none'); continue; }
    nd.g.removeAttribute('display');
    nd.g.setAttribute('transform', 'translate(' + f1(SX(P.X)) + ',' + f1(SY(P.Y)) + ')');

    var col = SEG[P.g].c;
    nd.hit.setAttribute('r', String(R2));
    nd.hit.setAttribute('fill', 'transparent');
    nd.ring.setAttribute('r', String(P.c ? R * 0.74 : R));
    nd.ring.setAttribute('fill', P.c ? '#ffffff' : col);
    nd.ring.setAttribute('stroke', (i === active) ? '#1a5fb4' : (P.c ? '#b6bcc6' : '#ffffff'));
    nd.ring.setAttribute('stroke-width', String(i === active ? Math.max(2.4, 2.8 * px) : Math.max(1.6, 1.9 * px)));

    nd.num.setAttribute('text-anchor', 'middle');
    nd.num.setAttribute('dominant-baseline', 'central');
    nd.num.setAttribute('y', '0.5');
    nd.num.setAttribute('font-size', String(P.c ? fs * 0.9 : fs));
    nd.num.setAttribute('font-weight', '600');
    nd.num.setAttribute('fill', P.c ? '#5a5f6a' : '#ffffff');
    nd.num.setAttribute('pointer-events', 'none');
    if (nd.num.textContent !== String(P.no)) nd.num.textContent = String(P.no);

    var labOn = (P.lv === 1 && lab1) || (P.lv === 2 && lab2) || (P.lv === 3 && lab3);
    if (labOn){
      nd.lbl.removeAttribute('display');
      nd.lbl.setAttribute('text-anchor', 'middle');
      nd.lbl.setAttribute('y', String(-(R + lf * 0.55)));
      nd.lbl.setAttribute('font-size', String(lf));
      nd.lbl.setAttribute('font-weight', P.c ? '400' : '600');
      nd.lbl.setAttribute('fill', P.c ? '#7b818b' : '#16181d');
      nd.lbl.setAttribute('stroke', 'rgba(255,255,255,.94)');
      nd.lbl.setAttribute('stroke-width', String(lf * 0.3));
      nd.lbl.setAttribute('paint-order', 'stroke');
      nd.lbl.setAttribute('pointer-events', 'none');
      if (nd.lbl.textContent !== P.n) nd.lbl.textContent = P.n;
    } else {
      nd.lbl.setAttribute('display', 'none');
    }
  }

  updateScale();
}

function updateScale(){
  var kmPerPx = KMU / (k * s);
  var cands = [20, 50, 100, 200, 300, 500, 1000], best = cands[0], bw = 0;
  for (var i = 0; i < cands.length; i++){
    var w = cands[i] / kmPerPx;
    if (w <= 104){ best = cands[i]; bw = w; }
  }
  sbTxt.textContent = best + ' km';
  sbBar.style.width = Math.max(24, bw).toFixed(0) + 'px';
}

/* ================= 视图 ================= */
function bboxOf(list){
  var xs = list.map(function(p){ return p.X; }), ys = list.map(function(p){ return p.Y; });
  return {x0:Math.min.apply(null, xs), x1:Math.max.apply(null, xs), y0:Math.min.apply(null, ys), y1:Math.max.apply(null, ys)};
}
function fitList(list, padPx){
  if (!list.length) return;
  var pad = (padPx === undefined ? 26 : padPx) / s;
  var b = bboxOf(list);
  var w = Math.max(b.x1 - b.x0, 4), hh = Math.max(b.y1 - b.y0, 4);
  var kk = Math.min((1000 - pad * 2) / w, (VH - pad * 2) / hh);
  kk = Math.max(kMin, Math.min(kMax, kk));
  k = kk;
  tx = 500 - k * (b.x0 + b.x1) / 2;
  ty = VH / 2 - k * (b.y0 + b.y1) / 2;
  clampView();
  schedule();
}
function clampView(){
  var spanX = 1000 * k, spanY = VH * k;
  tx = Math.max(1000 - spanX - 1000 * 0.4, Math.min(1000 * 0.4, tx));
  ty = Math.max(VH - spanY - VH * 0.4, Math.min(VH * 0.4, ty));
}
function zoomAt(pxx, pyy, factor){
  var nk = Math.max(kMin, Math.min(kMax, k * factor));
  if (nk === k) return;
  var ux = pxx / s, uy = pyy / s;
  var X = (ux - tx) / k, Y = (uy - ty) / k;
  k = nk; tx = ux - k * X; ty = uy - k * Y;
  clampView(); schedule();
}
function resetView(){
  if (filter === 'all'){
    fitList(S, 26);
    kMin = Math.max(0.5, k * 0.72);
  } else {
    var gi = Number(filter);
    var idx = S.filter(function(p){ return p.g === gi; });
    var first = S[S.indexOf(idx[0]) - 1];
    fitList(first ? [first].concat(idx) : idx, 32);
  }
  schedule();
}

/* ================= 交互 ================= */
var ptrs = {}, lastDist = 0, lastMid = null;
function ptPos(e){ var r = svg.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; }
function actPtrs(){ return Object.keys(ptrs).map(function(id){ return ptrs[id]; }); }

svg.addEventListener('pointerdown', function(e){
  svg.setPointerCapture(e.pointerId);
  ptrs[e.pointerId] = ptPos(e);
  svg.classList.add('grabbing');
  if (actPtrs().length === 2){
    var a = actPtrs();
    lastDist = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
    lastMid = {x:(a[0].x + a[1].x) / 2, y:(a[0].y + a[1].y) / 2};
  }
});
svg.addEventListener('pointermove', function(e){
  if (!ptrs[e.pointerId]) return;
  var prev = ptrs[e.pointerId], now = ptPos(e);
  ptrs[e.pointerId] = now;
  var list = actPtrs();
  if (list.length === 1){
    tx += (now.x - prev.x) / s; ty += (now.y - prev.y) / s;
    clampView(); schedule();
  } else if (list.length === 2){
    var dist = Math.hypot(list[0].x - list[1].x, list[0].y - list[1].y);
    var mid = {x:(list[0].x + list[1].x) / 2, y:(list[0].y + list[1].y) / 2};
    if (lastDist > 0) zoomAt(mid.x, mid.y, dist / lastDist);
    tx += (mid.x - lastMid.x) / s; ty += (mid.y - lastMid.y) / s;
    lastDist = dist; lastMid = mid;
    clampView(); schedule();
  }
});
function endPtr(e){
  delete ptrs[e.pointerId];
  if (!actPtrs().length){ svg.classList.remove('grabbing'); lastDist = 0; }
}
svg.addEventListener('pointerup', endPtr);
svg.addEventListener('pointercancel', endPtr);
svg.addEventListener('wheel', function(e){
  e.preventDefault();
  var p = ptPos(e);
  zoomAt(p.x, p.y, e.deltaY < 0 ? 1.2 : 1 / 1.2);
}, {passive:false});

document.getElementById('bIn').onclick = function(){ zoomAt(cw / 2, ch / 2, 1.5); };
document.getElementById('bOut').onclick = function(){ zoomAt(cw / 2, ch / 2, 1 / 1.5); };
document.getElementById('bFit').onclick = function(){ filter = 'all'; syncChips(); resetView(); buildList(); say('已回到全景'); };

svg.addEventListener('click', function(){ closeTip(); });

/* ================= 详情卡 ================= */
function openTip(i, fly){
  var p = S[i];
  active = i;
  if (fly){
    k = Math.max(k, Math.min(kMax, 4.2));
    tx = 500 - k * p.X; ty = VH / 2 - k * p.Y;
    clampView();
  }
  schedule();
  var col = SEG[p.g].c;
  var meta = [];
  if (p.alt) meta.push('<span>海拔 <b>' + p.alt + ' m</b></span>');
  if (p.tk)  meta.push('<span>门票 <b>' + p.tk + '</b></span>');
  if (p.leg) meta.push('<span>自上一站 <b>' + p.leg.km + ' km · ' + p.leg.h + ' h</b>' + (p.leg.rd ? ' · ' + p.leg.rd : '') + '</span>');
  if (p.spur !== undefined) meta.push('<span>支线（不在主线上）</span>');
  if (p.c) meta.push('<span>途经城市</span>');
  meta.push('<span>' + p.lat.toFixed(3) + '\u00B0N, ' + p.lng.toFixed(3) + '\u00B0E</span>');

  tipEl.innerHTML =
      '<button class="cls" aria-label="关闭">×</button>'
    + '<div class="h"><span class="badge" style="background:' + (p.c ? '#8b909a' : col) + '">' + p.no + '</span>'
    +   '<span class="nm">' + p.n + '</span></div>'
    + '<p class="dt">' + p.d + ' &nbsp;·&nbsp; ' + SEG[p.g].full + ' ' + SEG[p.g].d + '</p>'
    + (p.t ? '<p class="tx">' + p.t + '</p>' : '')
    + '<div class="mt">' + meta.join('') + '</div>';
  tipEl.classList.add('on');
  tipEl.querySelector('.cls').onclick = function(){ closeTip(); };
  [].forEach.call(document.querySelectorAll('#plist .it'), function(el){
    el.classList.toggle('act', Number(el.dataset.i) === i);
  });
}
function closeTip(){
  tipEl.classList.remove('on');
  active = -1;
  [].forEach.call(document.querySelectorAll('#plist .it'), function(el){ el.classList.remove('act'); });
  schedule();
}

/* ================= 列表 / 分段 ================= */
function syncChips(){
  [].forEach.call(chipsEl.querySelectorAll('button'), function(x){
    var f = x.dataset.f, on = (f === filter);
    x.classList.toggle('on', on);
    x.style.background = (on && f !== 'all') ? SEG[Number(f)].c : (on ? '#16181d' : '');
  });
}
function buildChips(){
  var h = '<button data-f="all" class="on">全部 ' + S.length + ' 个点位</button>';
  SEG.forEach(function(sg, i){ h += '<button data-f="' + i + '">' + sg.n + '</button>'; });
  chipsEl.innerHTML = h;
  [].forEach.call(chipsEl.querySelectorAll('button'), function(b){
    b.onclick = function(){
      filter = b.dataset.f;
      syncChips();
      closeTip();
      resetView();
      buildList();
      if (filter !== 'all') say('已聚焦「' + SEG[Number(filter)].full + '」 ' + SEG[Number(filter)].d);
    };
  });
}
function buildList(){
  var h = '';
  SEG.forEach(function(sg, gi){
    if (filter !== 'all' && gi !== Number(filter)) return;
    var items = S.filter(function(p){ return p.g === gi; });
    if (!items.length && !sg.note) return;
    h += '<div class="grp"><i style="background:' + sg.c + '"></i>' + sg.full + ' · ' + sg.d
       + (sg.note ? '<span style="color:#96a0ac">｜' + sg.note + '</span>' : '') + '</div>';
    items.forEach(function(p){
      var i = S.indexOf(p);
      h += '<div class="it" data-i="' + i + '">'
         +   '<span class="bd' + (p.c ? ' city' : '') + '" style="' + (p.c ? '' : 'background:' + sg.c) + '">' + p.no + '</span>'
         +   '<span style="flex:1;min-width:0">'
         +     '<div class="nm">' + p.n + (p.spur !== undefined ? ' <span style="font-size:10.5px;color:#96a0ac">（支线）</span>' : '') + '</div>'
         +     '<div class="dt">' + p.d + (p.alt ? ' · 海拔 ' + p.alt + ' m' : '') + '</div>'
         +     (p.leg ? '<div class="lg">↳ 自上一站 ' + p.leg.km + ' km · ' + p.leg.h + ' h' + (p.leg.rd ? ' · ' + p.leg.rd : '') + '</div>' : '')
         +     (p.t ? '<div class="tx">' + p.t + '</div>' : '')
         +   '</span></div>';
    });
  });
  plist.innerHTML = h;
  [].forEach.call(plist.querySelectorAll('.it'), function(el){
    el.onclick = function(){
      sheet.classList.add('collapsed');
      openTip(Number(el.dataset.i), true);
    };
  });
}

/* ================= 图层开关 ================= */
document.getElementById('grab').onclick = function(){ sheet.classList.toggle('collapsed'); };
document.getElementById('bLayers').onclick = function(){
  layersEl.classList.toggle('on');
  this.classList.toggle('on', layersEl.classList.contains('on'));
};
document.getElementById('layers').addEventListener('click', function(e){ e.stopPropagation(); });
svg.addEventListener('pointerdown', function(){ layersEl.classList.remove('on'); document.getElementById('bLayers').classList.remove('on'); });

var CK = {ckT:'terr', ckM:'mtn', ckR:'road', ckL:'leg', ckA:'alt', ckG:'grat'};
Object.keys(CK).forEach(function(id){
  document.getElementById(id).onchange = function(){
    layer[CK[id]] = this.checked;
    schedule();
  };
});

function say(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(function(){ toastEl.classList.remove('on'); }, 2200);
}

document.getElementById('legend').innerHTML = SEG.map(function(sg){
  return '<div><i style="background:' + sg.c + '"></i>' + sg.full + '</div>';
}).join('');

/* ================= 启动 ================= */
function schedule(){
  if (rafPending) return;
  rafPending = true;
  var run = function(){ rafPending = false; render(); };
  if (window.requestAnimationFrame) requestAnimationFrame(run); else setTimeout(run, 16);
}

function start(){
  layout();
  build();
  buildChips();
  syncChips();
  buildList();
  fitList(S, 26);
  kMin = Math.max(0.5, k * 0.72);
  render();
  document.getElementById('hudSub').textContent =
    '9/30 广州出发 · 10/29 返程 · ' + S.length + ' 个点位 · 约 ' + totalKm().toLocaleString('en-US') + ' km';
}
window.addEventListener('resize', function(){ layout(); schedule(); });
window.addEventListener('load', start);
if (document.readyState === 'complete') start();

})();
</script>
