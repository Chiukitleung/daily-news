<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>黔川 + 新疆 30 天自驾 · 真实底图路线图</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --line:#e6e8ec; --line2:#d8dbe1;
  --t1:#12151b; --t2:#4a5058; --t3:#868c95; --blue:#1a5fb4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--t1);background:var(--bg);overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

#top{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--card);
  border-bottom:1px solid var(--line);flex:0 0 auto}
#top .back{font-size:12.5px;font-weight:600;color:var(--blue);text-decoration:none;
  border:1px solid #cfe0f5;background:#f2f7fd;border-radius:7px;padding:5px 9px;white-space:nowrap}
#top h1{margin:0;font-size:14.5px;font-weight:600;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#top .sub{font-size:11px;color:var(--t3);font-weight:400;display:block}

#stage{position:relative;flex:1 1 auto;min-height:0;background:#eef0f3;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#cv.drag{cursor:grabbing}

#tools{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:12}
#tools button{width:34px;height:34px;border:1px solid var(--line2);background:rgba(255,255,255,.94);
  border-radius:9px;font-size:16px;line-height:1;color:var(--t2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.07);padding:0}
#tools button:active{background:#eef2f8}
#tools button.wide{width:auto;padding:0 10px;font-size:12px;font-weight:600}

#layers{position:absolute;left:10px;top:10px;z-index:12;background:rgba(255,255,255,.95);
  border:1px solid var(--line2);border-radius:10px;box-shadow:0 3px 12px rgba(0,0,0,.08);
  padding:7px 9px;font-size:12px;max-width:172px}
#layers .lt{font-size:10.5px;color:var(--t3);margin-bottom:4px;letter-spacing:.04em}
#layers label{display:flex;align-items:center;gap:6px;padding:3px 0;cursor:pointer;color:var(--t2)}
#layers input{margin:0;width:13px;height:13px;accent-color:var(--blue)}
#layers .fold{font-size:10.5px;color:var(--blue);cursor:pointer;margin-top:3px;user-select:none}

#pop{position:absolute;left:10px;right:10px;bottom:10px;z-index:14;max-width:430px;margin:0 auto;
  background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:11px 13px;
  box-shadow:0 10px 30px rgba(0,0,0,.16);display:none}
#pop.on{display:block}
#pop .ph{display:flex;align-items:baseline;gap:8px}
#pop .nm{font-size:15px;font-weight:600;flex:1;min-width:0}
#pop .cl{font-size:18px;color:var(--t3);cursor:pointer;line-height:1;padding:0 2px}
#pop .meta{font-size:11.5px;color:var(--t3);margin:2px 0 6px}
#pop .tx{font-size:12.5px;color:var(--t2);line-height:1.65}
#pop .tag{display:inline-block;font-size:11px;color:#7a5a10;background:#fdf5e2;border:1px solid #f0e2bd;
  border-radius:5px;padding:1px 6px;margin:0 0 6px}

#hud{position:absolute;left:10px;bottom:10px;z-index:11;font-size:11px;color:var(--t2);
  background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:8px;padding:5px 8px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);pointer-events:none}
#hud b{color:var(--t1)}
#credit{position:absolute;right:8px;bottom:10px;z-index:11;font-size:10px;color:#9aa0a8}

#sheet{flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);
  display:flex;flex-direction:column;max-height:46vh;transition:max-height .22s ease}
#sheet.min{max-height:52px}
#grab{padding:7px 0 3px;text-align:center;cursor:pointer;flex:0 0 auto}
#grab i{display:inline-block;width:38px;height:4px;border-radius:2px;background:#d9dce1}
#chips{display:flex;gap:6px;overflow-x:auto;padding:3px 12px 8px;flex:0 0 auto;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
#chips button{flex:0 0 auto;font-size:12px;padding:5px 11px;border-radius:20px;
  border:1px solid var(--line2);background:#fff;color:var(--t2);cursor:pointer;white-space:nowrap}
#chips button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
#list{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px 14px}
#list .row{display:flex;gap:9px;align-items:flex-start;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}
#list .row:active{background:#f7f9fc}
#list .bd{flex:0 0 auto;width:9px;height:9px;border-radius:50%;margin-top:6px;border:2px solid #fff;
  box-shadow:0 0 0 1.5px currentColor;background:currentColor}
#list .bd.city{width:8px;height:8px;border-radius:2px}
#list .nm{font-size:13.5px;font-weight:500;line-height:1.4}
#list .dt{font-size:11.5px;color:var(--t3);margin-top:1px}
#list .lg{font-size:11px;color:#8a8f99}
#list .tx{font-size:11.5px;color:var(--t2);margin-top:3px;line-height:1.55}
#sheet .hint{font-size:10.5px;color:var(--t3);text-align:center;padding:0 12px 8px}

@media(min-width:820px){
  #app{flex-direction:row}
  #sheet{order:-1;max-height:none;width:352px;border-top:0;border-right:1px solid var(--line)}
  #sheet.min{max-height:none}
  #grab{display:none}
  #stage{flex:1}
}
</style>
</head>
<body>

  <header id="top">

    <div id="pop">
      <div class="ph"><span class="nm" id="pNm"></span><span class="cl" id="pCl">×</span></div>

  <section id="sheet">

  </section>
</div>

  ctx.fillStyle = 'rgba(120,105,70,.95)'; ctx.textAlign='center'; ctx.textBaseline='middle';
  for (var j=0;j<D.terr.length;j++){
    if (!D.terr[j].lp) continue;
    var p = [sx(D.terr[j].lp[0]), sy(D.terr[j].lp[1])];
    if (p[0]<-80||p[0]>W+80||p[1]<-40||p[1]>H+40) continue;
    label(D.terr[j].n, p[0], p[1], 'rgba(255,255,255,.72)', 'rgba(120,105,70,.95)');
  }
}
function drawRidge(){
  if (!layer.ridge) return;
  var showName = view.z >= 6.6;
  for (var i=0;i<D.ridge.length;i++){
    var r = D.ridge[i];
    ctx.beginPath();
    for (var j=0;j<r.p.length;j++){ var p=[sx(r.p[j][0]), sy(r.p[j][1])]; if(j)ctx.lineTo(p[0],p[1]); else ctx.moveTo(p[0],p[1]); }
    ctx.strokeStyle='rgba(122,104,72,.62)'; ctx.lineWidth=2.2; ctx.setLineDash([7,4.5]); ctx.stroke(); ctx.setLineDash([]);
    if (showName && r.lp){
      var q=[sx(r.lp[0]), sy(r.lp[1])];
      if (q[0]>-90&&q[0]<W+90&&q[1]>-40&&q[1]<H+40){
        ctx.font='600 11px -apple-system,"PingFang SC",sans-serif';
        label(r.n, q[0], q[1], 'rgba(255,255,255,.78)', 'rgba(105,88,58,.95)');
      }
    }
  }
}

/* ---------- 路线 ---------- */
function drawRoutes(){
  if (!layer.route) return;
  /* 白色底衬 + 彩色主线：双层描边，压在底图上很清楚 */
  var segs = [];
  for (var g=0; g<D.geo.length; g++){
    if (filter !== 'all' && filter !== g) continue;
    segs.push({ pts:D.geo[g], c:D.seg[g].c, dash:null });
  }
  if (layer.alt) segs.push({ pts:D.alt, c:'#8b909a', dash:[9,7] });
  for (var k=0;k<2;k++){
    for (var i=0;i<segs.length;i++){
      var s = segs[i];
      ctx.beginPath();
      for (var j=0;j<s.pts.length;j++){ var p=[sx(s.pts[j][0]), sy(s.pts[j][1])]; if(j)ctx.lineTo(p[0],p[1]); else ctx.moveTo(p[0],p[1]); }
      ctx.lineCap='round'; ctx.lineJoin='round';
      if (s.dash) ctx.setLineDash(s.dash); else ctx.setLineDash([]);
      if (k===0){ ctx.strokeStyle='rgba(255,255,255,.95)'; ctx.lineWidth=6.5; }
      else { ctx.strokeStyle=s.c; ctx.lineWidth=3.6; }
      ctx.stroke();
    }
  }
  ctx.setLineDash([]);
}

/* ---------- 里程标签 ---------- */
function legLabelPos(g, km, hh){
  var pts = D.geo[g];
  if (!pts || pts.length < 2) return null;
  /* 取路径中点附近的一个顶点，带法线偏移，减少互撞 */
  var i = Math.max(1, Math.floor(pts.length/2));
  var a = pts[i-1], b = pts[i], c = pts[Math.min(pts.length-1, i+1)];
  var p = [sx(b[0]), sy(b[1])];
  var d1 = [sx(b[0])-sx(a[0]), sy(b[1])-sy(a[1])], d2 = [sx(c[0])-sx(b[0]), sy(c[1])-sy(b[1])];
  var dx = (d1[0]+d2[0])/2, dy = (d1[1]+d2[1])/2, L2 = Math.hypot(dx,dy)||1;
  var nx = -dy/L2, ny = dx/L2, off = (i%2? 15:-15);
  return { x:p[0]+nx*off, y:p[1]+ny*off, t:km+' km · '+hh+' h' };
}
function drawLegs(){
  if (!layer.leg || view.z < 6.9) return;
  ctx.font='600 10.5px -apple-system,"PingFang SC",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for (var i=0;i<D.pts.length;i++){
    var p = D.pts[i];
    if (!p.leg || !p.leg.km) continue;
    if (filter !== 'all' && filter !== p.g) continue;
    var q = legLabelPos(p.g, p.leg.km, p.leg.h);
    if (!q) continue;
    if (q.x<-60||q.x>W+60||q.y<-30||q.y>H+30) continue;
    label(q.t, q.x, q.y, 'rgba(255,255,255,.92)', '#4a5058', 'rgba(214,218,224,.95)');
  }
}

/* ---------- 标签绘制（带圆角底） ---------- */
function label(txt, x, y, bg, fg, bd){
  var w = ctx.measureText(txt).width, pw = w+10, ph = 16, r = 4;
  ctx.beginPath();
  ctx.moveTo(x-pw/2+r, y-ph/2);
  ctx.lineTo(x+pw/2-r, y-ph/2); ctx.quadraticCurveTo(x+pw/2, y-ph/2, x+pw/2, y-ph/2+r);
  ctx.lineTo(x+pw/2, y+ph/2-r); ctx.quadraticCurveTo(x+pw/2, y+ph/2, x+pw/2-r, y+ph/2);
  ctx.lineTo(x-pw/2+r, y+ph/2); ctx.quadraticCurveTo(x-pw/2, y+ph/2, x-pw/2, y+ph/2-r);
  ctx.lineTo(x-pw/2, y-ph/2+r); ctx.quadraticCurveTo(x-pw/2, y-ph/2, x-pw/2+r, y-ph/2);
  ctx.closePath();
  ctx.fillStyle = bg; ctx.fill();
  if (bd){ ctx.strokeStyle = bd; ctx.lineWidth = 1; ctx.stroke(); }
  ctx.fillStyle = fg; ctx.fillText(txt, x, y+0.5);
}

/* ---------- 点位与标注 ---------- */
function visiblePts(){
  var out = [];
  for (var i=0;i<D.pts.length;i++){
    var p = D.pts[i];
    if (filter !== 'all' && p.g !== filter) continue;
    if (filter === 'all'){
      if (view.z < 6.2 && !p.hub) continue;
      if (view.z < 7.4 && p.lv > 1 && !p.hub) continue;
      if (view.z < 8.8 && p.lv > 2 && !p.hub) continue;
    }
    out.push(i);
  }
  return out;
}
function drawPts(){
  var v = visiblePts();
  var placed = [];
  /* 先点后名：点按三级尺寸 */
  for (var a=0;a<v.length;a++){
    var i = v[a], p = D.pts[i];
    var x = sx(p.lng), y = sy(p.lat);
    if (x<-40||x>W+40||y<-30||y>H+30) continue;
    var col = D.seg[p.g].c, r = (i===active)? 7 : (p.c===1? (p.lv===1?5.4:4.2) : (p.lv===1?5:3.6));
    ctx.beginPath();
    ctx.arc(x, y, r+1.6, 0, 6.2832); ctx.fillStyle = 'rgba(255,255,255,.96)'; ctx.fill();
    ctx.beginPath();
    ctx.arc(x, y, r, 0, 6.2832); ctx.fillStyle = col; ctx.fill();
    if (i === active){ ctx.strokeStyle='#12151b'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,r+3.6,0,6.2832); ctx.stroke(); }
    /* 名称：只给重要点位 + 不重叠 */
    var wantName = (p.lv === 1) || (p.c === 1 && view.z >= 8) || (view.z >= 9.4) || i === active;
    if (!wantName) continue;
    ctx.font = (p.c===1? '600 12px ':'500 11.5px ') + '-apple-system,"PingFang SC",sans-serif';
    var w = ctx.measureText(p.n).width + 12;
    var lx = x + r + 6 + w/2, ly = y - r - 9;
    var ok = true;
    for (var b=0;b<placed.length;b++){
      var q = placed[b];
      if (Math.abs(q[0]-lx) < (q[2]+w)/2 && Math.abs(q[1]-ly) < 15) { ok = false; break; }
    }
    if (!ok) continue;
    placed.push([lx, ly, w]);
    label(p.n, lx, ly, 'rgba(255,255,255,.93)', p.c===1? '#12151b':'#3c4149', 'rgba(210,215,222,.95)');
  }
}
function drawPeaks(){
  if (!layer.peak || view.z < 6.4) return;
  for (var i=0;i<D.peaks.length;i++){
    var k = D.peaks[i], x = sx(k.lng), y = sy(k.lat);
    if (x<-40||x>W+40||y<-30||y>H+30) continue;
    ctx.beginPath(); ctx.moveTo(x, y-8); ctx.lineTo(x+7.5, y+5); ctx.lineTo(x-7.5, y+5); ctx.closePath();
    ctx.fillStyle='#6b5a3a'; ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=1.2; ctx.stroke();
    ctx.font='600 10.5px -apple-system,"PingFang SC",sans-serif';
    label(k.n+' '+k.h+'m', x, y-16, 'rgba(255,253,246,.94)', '#6b5a20', 'rgba(226,216,186,.95)');
  }
}

/* ---------- 比例尺 ---------- */
function drawScale(){
  var lat = latAt(view.cy, view.z);
  var mpp = 156543.03392 * Math.cos(lat*D2R) / Math.pow(2, view.z);
  var target = 90 * mpp;            /* 目标 ~90px */
  var pow = Math.pow(10, Math.floor(Math.log10(target)));
  var mult = [1,2,5,10].find(function(m){ return m*pow >= target; }) || 10;
  var m = mult*pow, px = m/mpp;
  ctx.strokeStyle='#5a6069'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(8,H-30); ctx.lineTo(8+px,H-30);
  ctx.moveTo(8,H-34); ctx.lineTo(8,H-26); ctx.moveTo(8+px,H-34); ctx.lineTo(8+px,H-26); ctx.stroke();
  ctx.fillStyle='#4a5058'; ctx.font='600 10.5px -apple-system,sans-serif'; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText(m>=1000? (m/1000)+' km' : m+' m', 8, H-36);
  var el = document.getElementById('scale');
  el.textContent = '比例 ' + (m>=1000? (m/1000)+'km' : m+'m') + ' / ' + Math.round(px) + 'px';
}

/* ---------- 主绘制 ---------- */
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#eef0f3'; ctx.fillRect(0,0,W,H);
  drawTiles();
  drawTerr();
  drawRidge();
  drawRoutes();
  drawLegs();
  drawPts();
  drawPeaks();
  drawScale();
  var zt = levelNear(view.z);
  document.getElementById('sub').textContent =
    '真实底图 z' + view.z.toFixed(1) + ' · 瓦片 z' + zt + ' · 拖动平移 · 双指缩放';
}

/* ---------- 视野控制 ---------- */
function center(lng, lat){ view.cx = X(lng, view.z); view.cy = Y(lat, view.z); }
function flyTo(lng, lat, z, ms){
  var z0 = view.z, cx0 = view.cx, cy0 = view.cy;
  var cx1 = X(lng, z), cy1 = Y(lat, z);
  var t0 = performance.now(), dur = ms || 420;
  function step(t){
    var u = Math.min(1, (t-t0)/dur), e = u<.5? 2*u*u : -1+(4-2*u)*u;
    view.z = z0+(z-z0)*e; view.cx = cx0+(cx1-cx0)*e; view.cy = cy0+(cy1-cy0)*e;
    draw();
    if (u<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function fitBox(w, e, s, n, pad){
  pad = pad || 26;
  var z = MINZ;
  for (var t = MINZ; t <= 7.6; t += 0.02){
    var ww = X(e,t)-X(w,t), hh = Y(s,t)-Y(n,t);
    if (ww > W-pad*2 || hh > H-pad*2) break;
    z = t;
  }
  view.z = z;
  view.cx = (X(w,z)+X(e,z))/2;
  view.cy = (Y(s,z)+Y(n,z))/2;
  return z;
}
function fitAll(pad){
  var lngs=[], lats=[];
  for (var g=0; g<D.geo.length; g++) for (var i=0;i<D.geo[g].length;i++){ lngs.push(D.geo[g][i][0]); lats.push(D.geo[g][i][1]); }
  fitBox(Math.min.apply(null,lngs), Math.max.apply(null,lngs),
         Math.min.apply(null,lats), Math.max.apply(null,lats), pad);
}
function fitSeg(g, pad){
  var lngs=[], lats=[];
  for (var i=0;i<D.geo[g].length;i++){ lngs.push(D.geo[g][i][0]); lats.push(D.geo[g][i][1]); }
  fitBox(Math.min.apply(null,lngs), Math.max.apply(null,lngs),
         Math.min.apply(null,lats), Math.max.apply(null,lats), pad || 30);
}

/* ---------- 交互 ---------- */
var ptrs = {}, drag = null;
cv.addEventListener('pointerdown', function(e){
  cv.setPointerCapture(e.pointerId);
  ptrs[e.pointerId] = { x:e.clientX, y:e.clientY };
  var ids = Object.keys(ptrs);
  if (ids.length === 1){ drag = { x:e.clientX, y:e.clientY }; cv.classList.add('drag'); }
  else if (ids.length === 2){
    var a = ptrs[ids[0]], b = ptrs[ids[1]];
    drag = { pinch: Math.hypot(a.x-b.x, a.y-b.y), z: view.z, mx:(a.x+b.x)/2, my:(a.y+b.y)/2 };
  }
});
cv.addEventListener('pointermove', function(e){
  if (!ptrs[e.pointerId]) return;
  ptrs[e.pointerId] = { x:e.clientX, y:e.clientY };
  var ids = Object.keys(ptrs);
  if (ids.length >= 2 && drag && drag.pinch){
    var a = ptrs[ids[0]], b = ptrs[ids[1]];
    var d = Math.hypot(a.x-b.x, a.y-b.y);
    var nz = Math.max(MINZ, Math.min(MAXZ, drag.z + Math.log2(d/drag.pinch)));
    zoomAt(nz, (a.x+b.x)/2, (a.y+b.y)/2);
  } else if (drag && drag.x != null){
    view.cx -= (e.clientX - drag.x);
    view.cy -= (e.clientY - drag.y);
    drag.x = e.clientX; drag.y = e.clientY;
    draw();
  }
});
function endPtr(e){
  delete ptrs[e.pointerId];
  var ids = Object.keys(ptrs);
  if (!ids.length){ drag = null; cv.classList.remove('drag'); }
  else if (ids.length === 1){ var p = ptrs[ids[0]]; drag = { x:p.x, y:p.y }; }
}
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('wheel', function(e){
  e.preventDefault();
  zoomAt(Math.max(MINZ, Math.min(MAXZ, view.z - e.deltaY*0.0022)), e.clientX - cv.getBoundingClientRect().left, e.clientY - cv.getBoundingClientRect().top);
}, { passive:false });
function zoomAt(nz, ax, ay){
  var r = cv.getBoundingClientRect();
  ax = ax - r.left; ay = ay - r.top;
  var wx = view.cx + (ax - W/2), wy = view.cy + (ay - H/2);
  var k = Math.pow(2, nz - view.z);
  view.cx = wx*k - (ax - W/2);
  view.cy = wy*k - (ay - H/2);
  view.z = nz;
  draw();
}
/* 点击拾取 */
cv.addEventListener('click', function(e){
  var r = cv.getBoundingClientRect(), mx = e.clientX-r.left, my = e.clientY-r.top;
  var v = visiblePts(), best = -1, bd = 20;
  for (var a=0;a<v.length;a++){
    var p = D.pts[v[a]], d = Math.hypot(sx(p.lng)-mx, sy(p.lat)-my);
    if (d < bd){ bd = d; best = v[a]; }
  }
  if (best >= 0) openPop(best); else closePop();
});

/* ---------- 弹窗 ---------- */
function openPop(i){
  active = i; draw();
  var p = D.pts[i];
  document.getElementById('pNm').textContent = p.n;
  var m = [];
  if (p.d) m.push(p.d);
  if (D.seg[p.g]) m.push(D.seg[p.g].full);
  if (p.alt) m.push('海拔 '+p.alt+' m');
  if (p.leg && p.leg.km) m.push(p.leg.km+' km · '+p.leg.h+' h'+(p.leg.rd? ' · '+p.leg.rd : ''));
  document.getElementById('pMeta').textContent = m.join('  ·  ');
  var tag = document.getElementById('pTag');
  if (p.tk){ tag.style.display='inline-block'; tag.textContent = '票 / 费用：'+p.tk; } else tag.style.display='none';
  document.getElementById('pTx').textContent = p.t || '';
  document.getElementById('pop').classList.add('on');
  flyTo(p.lng, p.lat, Math.max(view.z, 8.6), 480);
}
function closePop(){ active = -1; document.getElementById('pop').classList.remove('on'); draw(); }
document.getElementById('pCl').onclick = closePop;

/* ---------- 列表 / 分段 ---------- */
function buildChips(){
  var box = document.getElementById('chips');
  box.innerHTML = '';
  var all = [['all','全程']];
  for (var g=0; g<D.seg.length; g++) all.push([g, D.seg[g].full]);
  all.forEach(function(it){
    var b = document.createElement('button');
    b.textContent = it[1];
    b.onclick = function(){
      filter = it[0]; syncChips(); buildList(); closePop(); draw();
      if (filter === 'all') fitAll(26); else fitSeg(filter, 30);
      draw();
    };
    box.appendChild(b);
  });
  syncChips();
}
function syncChips(){
  var bs = document.getElementById('chips').children;
  for (var i=0;i<bs.length;i++){
    var id = i===0? 'all' : i-1;
    bs[i].className = (id === filter)? 'on' : '';
  }
}
function buildList(){
  var box = document.getElementById('list');
  box.innerHTML = '';
  for (var i=0;i<D.pts.length;i++){
    var p = D.pts[i];
    if (filter !== 'all' && p.g !== filter) continue;
    var d = document.createElement('div');
    d.className = 'row';
    d.innerHTML = '<span class="bd'+(p.c===1?' city':'')+'" style="color:'+D.seg[p.g].c+'"></span>' +
      '<span style="flex:1;min-width:0"><span class="nm">'+esc(p.n)+'</span>' +
      '<div class="dt">'+esc(p.d||'')+'</div>' +
      '<div class="lg">'+p.lat.toFixed(3)+'°N, '+p.lng.toFixed(3)+'°E'+(p.alt? ' · '+p.alt+'m':'')+ (p.leg&&p.leg.km? ' · '+p.leg.km+'km':'')+'</div>' +
      '<div class="tx">'+esc((p.t||'').slice(0,56))+((p.t||'').length>56? '…':'')+'</div></span>';
    (function(idx){ d.onclick = function(){ openPop(idx); }; })(i);
    box.appendChild(d);
  }
  document.getElementById('list').scrollTop = 0;
}
function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

document.getElementById('grab').onclick = function(){
  document.getElementById('sheet').classList.toggle('min');
  setTimeout(function(){ resize(); }, 240);
};
document.getElementById('bIn').onclick = function(){ zoomAt(Math.min(MAXZ, view.z+0.7), W/2, H/2); };
document.getElementById('bOut').onclick = function(){ zoomAt(Math.max(MINZ, view.z-0.7), W/2, H/2); };
document.getElementById('bAll').onclick = function(){ filter='all'; syncChips(); buildList(); closePop(); fitAll(26); draw(); };
document.getElementById('bMe').onclick = function(){
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(function(pos){
    flyTo(pos.coords.longitude, pos.coords.latitude, 11, 520);
  }, function(){}, { enableHighAccuracy:false, timeout:6000 });
};
['terr','ridge','route','leg','alt','peak'].forEach(function(k){
  var el = document.getElementById('L_'+k);
  el.checked = !!layer[k];
  el.onchange = function(){ layer[k] = el.checked?1:0; draw(); };
});
document.getElementById('fold').onclick = function(){
  var box = document.getElementById('layers'), on = box.classList.toggle('hid');
  this.textContent = on? '展开 +' : '收起 −';
  [].forEach.call(box.querySelectorAll('label,.lt'), function(n){ n.style.display = on? 'none':''; });
};

/* ---------- 启动 ---------- */
window.addEventListener('resize', resize);
view.cx = X(87.6, view.z); view.cy = Y(43.8, view.z);   /* 先落到路线中部，避免开局请求无关瓦片 */
resize();
buildChips();
buildList();
fitAll(26);
draw();
setTimeout(draw, 300);
</script>
</body>
</html>
